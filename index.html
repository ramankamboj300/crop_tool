<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartCrop Pro - Batch Image Cropper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        html, body { overscroll-behavior-y: contain; }
        .crop-area-wrapper {
            height: 420px;
            width: 100%;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cropper-container { width: 100% !important; height: 100% !important; }
        #image-to-crop { display: block; max-width: 100%; max-height: 100%; }
        #live-logo-preview {
            position: absolute;
            pointer-events: none;
            z-index: 50; /* Increased z-index */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            display: block !important;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .setting-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 16px;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 selection:bg-blue-100">

    <div class="max-w-xl mx-auto py-6 px-4 pb-24">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-900 mb-1 tracking-tight">SmartCrop <span class="text-blue-600">Pro</span></h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.25em]">Stable Version 2.1</p>
        </header>

        <div id="mainSection">
            <div class="glass-morphism p-6 rounded-[2rem] shadow-2xl mb-4 border border-white">
                
                <div class="mb-6">
                    <div class="flex gap-2 mb-4">
                        <div class="relative flex-1">
                            <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <button class="w-full border-2 border-dashed border-slate-200 rounded-2xl py-3 bg-white flex items-center justify-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                                <span class="text-slate-900 font-black text-xs uppercase">Add Images</span>
                            </button>
                        </div>
                    </div>

                    <div id="cropControls" class="hidden">
                        <div class="flex justify-between items-center mb-3">
                            <span id="imageCounter" class="text-[10px] font-black text-blue-600 uppercase tracking-widest">Photo 1 / 1</span>
                            <span id="currentImageName" class="text-[10px] text-slate-400 truncate max-w-[150px] font-medium italic">filename.jpg</span>
                        </div>
                        
                        <div class="flex gap-2 mb-3">
                            <button id="prevBtn" class="flex-1 py-3 bg-slate-900 text-white rounded-xl font-black text-sm uppercase flex items-center justify-center gap-1">Back</button>
                            <button id="nextCropBtn" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl font-black text-sm shadow-xl flex items-center justify-center gap-2 uppercase">
                                <span id="nextBtnText">Save & Next</span>
                                <div id="loader" class="hidden spinner"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400">01. Frame Settings</h2>
                    <span id="ratioDisplay" class="text-[9px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold uppercase">1440:2569 Preview</span>
                </div>

                <div class="crop-area-wrapper rounded-2xl mb-6 relative shadow-inner border border-slate-200" id="cropWrapper">
                    <img id="image-to-crop" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000" class="opacity-40">
                    <!-- Added inline styles to ensure visibility -->
                    <img id="live-logo-preview" src="" style="display:none;" alt="logo preview">
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Width (px)</label>
                        <input type="number" id="targetWidth" value="1440" min="100" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Height (px)</label>
                        <input type="number" id="targetHeight" value="2569" min="100" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                </div>

                <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">02. Branding</h2>
                <div class="grid grid-cols-1 gap-3">
                    <div class="setting-card">
                        <div class="flex gap-2">
                            <button onclick="setLogoStyle('auto')" id="btn-auto" class="logo-style-btn flex-1 py-2 rounded-lg text-[10px] font-black border-2 border-blue-600 bg-blue-50 text-blue-600 uppercase">Original</button>
                            <button onclick="setLogoStyle('white')" id="btn-white" class="logo-style-btn flex-1 py-2 rounded-lg text-[10px] font-black border-2 border-transparent bg-slate-100 text-slate-500 uppercase">White</button>
                            <button onclick="setLogoStyle('black')" id="btn-black" class="logo-style-btn flex-1 py-2 rounded-lg text-[10px] font-black border-2 border-transparent bg-slate-100 text-slate-500 uppercase">Black</button>
                        </div>
                    </div>

                    <div class="setting-card">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-[9px] font-bold text-slate-400 uppercase">Logo Size</label>
                            <span id="sizeValDisplay" class="text-[10px] font-black text-blue-600">17%</span>
                        </div>
                        <input type="range" id="logoSizeScale" min="5" max="50" value="17" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-2 uppercase">Logo Position</label>
                        <select id="logoPos" class="w-full bg-white border border-slate-200 rounded-lg py-2 px-3 text-[11px] font-bold outline-none">
                            <option value="bottom-right" selected>Bottom Right</option>
                            <option value="bottom-left">Bottom Left</option>
                            <option value="top-right">Top Right</option>
                            <option value="top-left">Top Left</option>
                            <option value="center">Center</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="resultSection" class="hidden">
            <div class="glass-morphism p-10 rounded-[2.5rem] shadow-2xl border border-white text-center">
                <div class="w-16 h-16 bg-emerald-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                </div>
                <h3 class="text-2xl font-black text-slate-900 mb-2">Success!</h3>
                <p id="processedCount" class="text-slate-500 font-medium mb-8 text-sm italic">0 images ready.</p>
                <button id="downloadBtn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg shadow-2xl flex items-center justify-center gap-4">
                    <span id="downloadBtnText">Download Zip</span>
                </button>
                <button onclick="location.reload()" class="w-full py-3 text-blue-600 font-black text-[10px] uppercase mt-4">New Batch</button>
            </div>
        </div>

        <canvas id="watermarkCanvas" class="hidden"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        let selectedFiles = [];
        let currentIndex = 0;
        let cropper = null;
        let croppedImagesBlobs = [];
        let selectedLogoMode = 'auto'; 
        
        const logoUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg1edao5rDgs_ghf8tGxg6k9pId-JtXvKk1cS74LOjykj6F2rtq47nT-aUL3ChsITB_x8SXGpKG-pck25IOE_vNc_0BPTupQ26iJSnz9GGGOYZD_TrXHKKVmplbAOr_9O_aoRJEM8qaicG9-oU8JRL_0qpcsncCzK4SIbOUTIIW2uf2x4m0UieJrlIXYL6u/s1600/ChatGPT%20Image%20Feb%2028,%202026,%2007_42_18%20PM.png";
        
        const logoImg = new Image();
        logoImg.crossOrigin = "anonymous";
        
        // Error handling for logo loading
        logoImg.onload = () => { console.log("Logo Loaded successfully"); updateLivePreview(); };
        logoImg.onerror = () => { console.error("Logo failed to load"); };
        logoImg.src = logoUrl;

        const ui = {
            mainSection: document.getElementById('mainSection'),
            cropControls: document.getElementById('cropControls'),
            resultSection: document.getElementById('resultSection'),
            fileInput: document.getElementById('fileInput'),
            imageToCrop: document.getElementById('image-to-crop'),
            liveLogo: document.getElementById('live-logo-preview'),
            logoSizeScale: document.getElementById('logoSizeScale'),
            sizeValDisplay: document.getElementById('sizeValDisplay'),
            nextCropBtn: document.getElementById('nextCropBtn'),
            nextBtnText: document.getElementById('nextBtnText'),
            loader: document.getElementById('loader'),
            prevBtn: document.getElementById('prevBtn'),
            targetWidth: document.getElementById('targetWidth'),
            targetHeight: document.getElementById('targetHeight'),
            logoPos: document.getElementById('logoPos'),
            imageCounter: document.getElementById('imageCounter'),
            currentImageName: document.getElementById('currentImageName'),
            processedCount: document.getElementById('processedCount'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadBtnText: document.getElementById('downloadBtnText'),
            ratioDisplay: document.getElementById('ratioDisplay'),
            wmCanvas: document.getElementById('watermarkCanvas')
        };

        function setLogoStyle(style) {
            selectedLogoMode = style;
            document.querySelectorAll('.logo-style-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
                btn.classList.add('border-transparent', 'bg-slate-100', 'text-slate-500');
            });
            document.getElementById('btn-' + style).classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
            updateLivePreview();
        }

        function updateLivePreview() {
            const scale = parseInt(ui.logoSizeScale.value);
            ui.sizeValDisplay.textContent = `${scale}%`;
            const pos = ui.logoPos.value;
            
            // Ensure image is visible
            ui.liveLogo.src = logoUrl;
            ui.liveLogo.style.display = 'block';
            ui.liveLogo.style.width = `${scale}%`;
            
            // Filters
            if (selectedLogoMode === 'white') ui.liveLogo.style.filter = 'brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.3))';
            else if (selectedLogoMode === 'black') ui.liveLogo.style.filter = 'brightness(0) drop-shadow(0 2px 4px rgba(255,255,255,0.1))';
            else ui.liveLogo.style.filter = 'drop-shadow(0 4px 6px rgba(0,0,0,0.3))';

            ui.liveLogo.style.top = 'auto'; ui.liveLogo.style.bottom = 'auto';
            ui.liveLogo.style.left = 'auto'; ui.liveLogo.style.right = 'auto';
            ui.liveLogo.style.transform = 'none';

            if (pos === 'bottom-right') { ui.liveLogo.style.bottom = '5%'; ui.liveLogo.style.right = '5%'; }
            else if (pos === 'bottom-left') { ui.liveLogo.style.bottom = '5%'; ui.liveLogo.style.left = '5%'; }
            else if (pos === 'top-right') { ui.liveLogo.style.top = '5%'; ui.liveLogo.style.right = '5%'; }
            else if (pos === 'top-left') { ui.liveLogo.style.top = '5%'; ui.liveLogo.style.left = '5%'; }
            else { ui.liveLogo.style.top = '50%'; ui.liveLogo.style.left = '50%'; ui.liveLogo.style.transform = 'translate(-50%, -50%)'; }
        }

        ui.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFiles = Array.from(e.target.files);
                currentIndex = 0;
                ui.cropControls.classList.remove('hidden');
                ui.imageToCrop.classList.remove('opacity-40');
                loadCurrentImage();
            }
        });

        function loadCurrentImage() {
            if (currentIndex >= selectedFiles.length) { 
                finishCropping(); 
                return; 
            }
            
            ui.imageCounter.textContent = `Photo ${currentIndex + 1} / ${selectedFiles.length}`;
            ui.currentImageName.textContent = selectedFiles[currentIndex].name;
            ui.prevBtn.disabled = currentIndex === 0;

            const reader = new FileReader();
            reader.onload = (e) => {
                ui.imageToCrop.src = e.target.result;
                if (cropper) cropper.destroy();
                
                const w = Math.max(100, parseInt(ui.targetWidth.value) || 1440);
                const h = Math.max(100, parseInt(ui.targetHeight.value) || 2569);

                cropper = new Cropper(ui.imageToCrop, {
                    aspectRatio: w / h,
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false,
                    ready() { updateLivePreview(); }
                });
            };
            reader.readAsDataURL(selectedFiles[currentIndex]);
        }

        async function processAndSave(croppedCanvas) {
            const tw = Math.max(100, parseInt(ui.targetWidth.value) || 1440);
            const th = Math.max(100, parseInt(ui.targetHeight.value) || 2569);
            
            if (!croppedCanvas || croppedCanvas.width === 0) throw new Error("Canvas Error");

            ui.wmCanvas.width = tw; 
            ui.wmCanvas.height = th;
            const ctx = ui.wmCanvas.getContext('2d');
            
            ctx.clearRect(0,0,tw,th);
            ctx.drawImage(croppedCanvas, 0, 0, tw, th);

            // Wait for logo if not loaded
            if (!logoImg.complete || logoImg.naturalWidth === 0) {
                await new Promise(r => {
                    logoImg.onload = r;
                    logoImg.onerror = r;
                });
            }

            if (logoImg.naturalWidth > 0) {
                const scale = parseInt(ui.logoSizeScale.value) / 100;
                const logoW = tw * scale;
                const fh = (logoW / logoImg.naturalWidth) * logoImg.naturalHeight;
                const mx = tw * 0.05;
                const my = th * 0.05;
                const pos = ui.logoPos.value;

                let x, y;
                if (pos === 'bottom-right') { x = tw - logoW - mx; y = th - fh - my; }
                else if (pos === 'bottom-left') { x = mx; y = th - fh - my; }
                else if (pos === 'top-right') { x = tw - logoW - mx; y = my; }
                else if (pos === 'top-left') { x = mx; y = my; }
                else { x = (tw - logoW) / 2; y = (th - fh) / 2; }

                const logoOffscreen = document.createElement('canvas');
                logoOffscreen.width = logoImg.naturalWidth;
                logoOffscreen.height = logoImg.naturalHeight;
                const lCtx = logoOffscreen.getContext('2d');
                lCtx.drawImage(logoImg, 0, 0);

                if (selectedLogoMode === 'white' || selectedLogoMode === 'black') {
                    lCtx.globalCompositeOperation = 'source-in';
                    lCtx.fillStyle = selectedLogoMode === 'white' ? '#ffffff' : '#000000';
                    lCtx.fillRect(0, 0, logoOffscreen.width, logoOffscreen.height);
                }
                ctx.drawImage(logoOffscreen, x, y, logoW, fh);
            }
            return new Promise(r => ui.wmCanvas.toBlob(b => r(b), 'image/jpeg', 0.95));
        }

        ui.nextCropBtn.addEventListener('click', async () => {
            if (!cropper || ui.nextCropBtn.disabled) return;
            
            ui.nextBtnText.classList.add('hidden');
            ui.loader.classList.remove('hidden');
            ui.nextCropBtn.disabled = true;

            try {
                const tw = Math.max(100, parseInt(ui.targetWidth.value) || 1440);
                const th = Math.max(100, parseInt(ui.targetHeight.value) || 2569);
                
                const canvas = cropper.getCroppedCanvas({ 
                    width: tw, 
                    height: th,
                    imageSmoothingQuality: 'high'
                });

                if (canvas) {
                    const blob = await processAndSave(canvas);
                    croppedImagesBlobs.push({ 
                        blob, 
                        fileName: `cropped_${currentIndex + 1}.jpg`
                    });
                    currentIndex++;
                    loadCurrentImage();
                }
            } catch (err) {
                console.error("Processing Error:", err);
            } finally {
                ui.nextBtnText.classList.remove('hidden');
                ui.loader.classList.add('hidden');
                ui.nextCropBtn.disabled = false;
            }
        });

        ui.prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                croppedImagesBlobs.pop();
                loadCurrentImage();
            }
        });

        function finishCropping() {
            ui.mainSection.classList.add('hidden');
            ui.resultSection.classList.remove('hidden');
            ui.processedCount.textContent = `${croppedImagesBlobs.length} images ready.`;
            ui.downloadBtnText.textContent = croppedImagesBlobs.length === 1 ? "Download Image" : "Download Zip";
        }

        ui.downloadBtn.addEventListener('click', async () => {
            if (croppedImagesBlobs.length === 0) return;
            if (croppedImagesBlobs.length === 1) {
                saveAs(croppedImagesBlobs[0].blob, croppedImagesBlobs[0].fileName);
            } else {
                const zip = new JSZip();
                croppedImagesBlobs.forEach(i => zip.file(i.fileName, i.blob));
                const zipBlob = await zip.generateAsync({ type: "blob" });
                saveAs(zipBlob, "batch_crops.zip");
            }
        });

        [ui.targetWidth, ui.targetHeight, ui.logoSizeScale, ui.logoPos].forEach(el => {
            el.addEventListener('input', () => {
                const w = parseInt(ui.targetWidth.value) || 1440;
                const h = parseInt(ui.targetHeight.value) || 2569;
                ui.ratioDisplay.textContent = `${w}:${h} PREVIEW`;
                if (cropper) cropper.setAspectRatio(w / h);
                updateLivePreview();
            });
        });

        // Trigger initial preview load
        window.addEventListener('load', () => {
            setTimeout(updateLivePreview, 500);
        });
    </script>
</body>
</html>
