<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartCrop Pro - Batch Image Cropper</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        /* Container rules to prevent overflow */
        .crop-area-wrapper {
            height: 400px;
            width: 100%;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cropper-container {
            width: 100% !important;
            height: 100% !important;
        }

        #image-to-crop {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fixed crop box appearance */
        .cropper-view-box, .cropper-face {
            outline: 3px solid #3b82f6;
            outline-color: rgba(59, 130, 246, 0.9);
        }

        /* Hide resize handles to ensure FIXED SIZE */
        .cropper-point, .cropper-line {
            display: none !important;
        }

        /* Optimized heights for smaller devices */
        @media (max-width: 640px) {
            .crop-area-wrapper {
                height: 340px;
            }
            .mobile-btn {
                padding-top: 0.75rem !important;
                padding-bottom: 0.75rem !important;
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-900 selection:bg-blue-100">

    <div class="max-w-xl mx-auto py-4 px-4 pb-20 md:py-8">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-black text-blue-600 mb-1 italic">SmartCrop Pro</h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em]">Fixed Pixels & Ratio Mode</p>
        </header>

        <!-- Step 1: Configuration & Upload -->
        <div id="uploadSection" class="fade-in">
            <div class="glass-morphism p-6 rounded-3xl shadow-xl mb-4 border border-white">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-black uppercase tracking-wider text-slate-400">1. Set Size & Ratio</h2>
                    <span id="ratioDisplay" class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded font-bold">RATIO: 9:16</span>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">Width (Pixels)</label>
                        <input type="number" id="targetWidth" value="1080" class="w-full bg-transparent font-black text-lg outline-none text-blue-600" oninput="updateRatioInfo()">
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-tighter">Height (Pixels)</label>
                        <input type="number" id="targetHeight" value="1920" class="w-full bg-transparent font-black text-lg outline-none text-blue-600" oninput="updateRatioInfo()">
                    </div>
                </div>
                
                <div class="relative group">
                    <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="border-2 border-dashed border-blue-200 rounded-3xl p-10 bg-blue-50/30 group-hover:bg-blue-50 transition-all flex flex-col items-center justify-center text-center">
                        <div class="w-14 h-14 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        <span class="text-blue-700 font-black">Select Photos</span>
                        <p class="text-[10px] text-slate-400 mt-1 uppercase font-bold tracking-tighter">Multiple files supported</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Cropping Interface -->
        <div id="cropSection" class="hidden fade-in">
            <div class="glass-morphism rounded-3xl shadow-2xl overflow-hidden border border-white">
                <!-- Status Bar -->
                <div class="bg-white px-5 py-3 border-b flex justify-between items-center">
                    <div class="flex flex-col">
                        <span id="imageCounter" class="text-[10px] font-black text-blue-600 uppercase tracking-widest leading-none mb-1">IMAGE 1 / 1</span>
                        <div class="flex items-center gap-2">
                             <span id="currentPixels" class="text-[9px] bg-slate-100 px-1.5 py-0.5 rounded font-bold text-slate-600">1080 x 1920</span>
                             <span id="currentImageName" class="text-[9px] text-slate-400 truncate max-w-[100px] italic">photo.jpg</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="document.getElementById('fileInput').click()" class="bg-blue-50 text-blue-600 p-2 rounded-xl hover:bg-blue-100 transition-colors" title="Add more photos">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        </button>
                        <button id="cancelBtn" class="bg-slate-50 text-slate-400 p-2 rounded-xl hover:text-red-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                </div>
                
                <div class="crop-area-wrapper">
                    <img id="image-to-crop" src="">
                </div>

                <!-- Footer Actions -->
                <div class="p-4 bg-white border-t border-slate-50">
                    <p class="text-[9px] text-center text-slate-400 font-bold uppercase mb-3 tracking-[0.15em]">Move box to select area</p>
                    <div class="flex flex-col gap-2">
                        <button id="nextCropBtn" class="mobile-btn w-full bg-blue-600 text-white py-3.5 rounded-2xl font-black text-lg hover:bg-blue-700 active:scale-95 transition-all shadow-xl shadow-blue-100 flex items-center justify-center gap-3 uppercase tracking-tight">
                            <span>Crop & Next</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <button id="skipBtn" class="w-full py-2.5 bg-red-50 text-red-500 font-black rounded-xl hover:bg-red-100 text-[10px] uppercase tracking-[0.1em] transition-colors border border-red-100">
                             Discard This Photo
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: Success & Download -->
        <div id="resultSection" class="hidden fade-in">
            <div class="glass-morphism p-8 rounded-3xl shadow-2xl border border-white text-center">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 border-2 border-emerald-100 shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4-4L19 7" />
                    </svg>
                </div>
                <h3 class="text-2xl font-black text-slate-800 mb-1">Batch Ready!</h3>
                <p id="processedCount" class="text-slate-500 font-medium mb-8 text-sm italic">All photos processed successfully.</p>
                
                <div class="flex flex-col gap-3">
                    <button id="downloadZipBtn" class="mobile-btn w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-lg hover:bg-black active:scale-95 transition-all shadow-2xl flex items-center justify-center gap-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Download ZIP
                    </button>
                    
                    <button onclick="document.getElementById('fileInput').click()" class="w-full py-3.5 bg-blue-50 text-blue-600 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-blue-100 transition-all border border-blue-100">
                        + Add More Photos
                    </button>
                </div>
                
                <button onclick="location.reload()" class="mt-8 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-200">Start New Batch</button>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="statusMessage" class="fixed bottom-6 left-6 right-6 bg-slate-900 text-white px-6 py-4 rounded-2xl text-[10px] font-black hidden z-50 shadow-2xl text-center border border-slate-700 uppercase tracking-wider">
            Processing...
        </div>
    </div>

    <!-- Core Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        let selectedFiles = [];
        let currentIndex = 0;
        let cropper = null;
        let croppedImagesBlobs = [];

        const ui = {
            uploadSection: document.getElementById('uploadSection'),
            cropSection: document.getElementById('cropSection'),
            resultSection: document.getElementById('resultSection'),
            fileInput: document.getElementById('fileInput'),
            imageToCrop: document.getElementById('image-to-crop'),
            nextCropBtn: document.getElementById('nextCropBtn'),
            skipBtn: document.getElementById('skipBtn'),
            cancelBtn: document.getElementById('cancelBtn'),
            downloadZipBtn: document.getElementById('downloadZipBtn'),
            statusMessage: document.getElementById('statusMessage'),
            targetWidth: document.getElementById('targetWidth'),
            targetHeight: document.getElementById('targetHeight'),
            currentImageName: document.getElementById('currentImageName'),
            imageCounter: document.getElementById('imageCounter'),
            processedCount: document.getElementById('processedCount'),
            ratioDisplay: document.getElementById('ratioDisplay'),
            currentPixels: document.getElementById('currentPixels')
        };

        function gcd(a, b) {
            return b ? gcd(b, a % b) : a;
        }

        function updateRatioInfo() {
            const w = parseInt(ui.targetWidth.value) || 1;
            const h = parseInt(ui.targetHeight.value) || 1;
            const common = gcd(w, h);
            ui.ratioDisplay.textContent = `RATIO: ${w/common}:${h/common}`;
            ui.currentPixels.textContent = `${w} x ${h}`;
        }

        ui.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const newFiles = Array.from(e.target.files);
                
                if (selectedFiles.length > 0) {
                    selectedFiles = selectedFiles.concat(newFiles);
                    if (!ui.resultSection.classList.contains('hidden')) {
                        ui.resultSection.classList.add('hidden');
                        ui.cropSection.classList.remove('hidden');
                        loadCurrentImage();
                    } else {
                        ui.imageCounter.textContent = `IMAGE ${currentIndex + 1} OF ${selectedFiles.length}`;
                        showMessage(`${newFiles.length} PHOTOS ADDED!`);
                    }
                } else {
                    selectedFiles = newFiles;
                    currentIndex = 0;
                    croppedImagesBlobs = [];
                    ui.uploadSection.classList.add('hidden');
                    ui.cropSection.classList.remove('hidden');
                    updateRatioInfo();
                    loadCurrentImage();
                }
                ui.fileInput.value = '';
            }
        });

        function showMessage(msg, duration = 2500) {
            ui.statusMessage.textContent = msg;
            ui.statusMessage.classList.remove('hidden');
            setTimeout(() => ui.statusMessage.classList.add('hidden'), duration);
        }

        function loadCurrentImage() {
            if (currentIndex >= selectedFiles.length) {
                finishCropping();
                return;
            }

            const file = selectedFiles[currentIndex];
            const reader = new FileReader();

            ui.currentImageName.textContent = file.name;
            ui.imageCounter.textContent = `IMAGE ${currentIndex + 1} OF ${selectedFiles.length}`;

            reader.onload = (e) => {
                ui.imageToCrop.src = e.target.result;
                if (cropper) cropper.destroy();

                const w = parseInt(ui.targetWidth.value) || 1080;
                const h = parseInt(ui.targetHeight.value) || 1920;

                cropper = new Cropper(ui.imageToCrop, {
                    aspectRatio: w / h,
                    viewMode: 1, 
                    autoCropArea: 0.9,
                    dragMode: 'move',
                    cropBoxResizable: false,
                    cropBoxMovable: true,
                    background: false,
                    responsive: true,
                    modal: true,
                    guides: true,
                    center: true,
                    highlight: false,
                    ready() {
                        window.scrollTo(0, 0);
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        ui.nextCropBtn.addEventListener('click', () => {
            if (!cropper) return;
            
            const w = parseInt(ui.targetWidth.value) || 1080;
            const h = parseInt(ui.targetHeight.value) || 1920;

            const canvas = cropper.getCroppedCanvas({
                width: w,
                height: h,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            canvas.toBlob((blob) => {
                const name = selectedFiles[currentIndex].name.replace(/\.[^/.]+$/, "") + `_${Date.now()}_cropped.jpg`;
                croppedImagesBlobs.push({ blob, fileName: name });
                currentIndex++;
                loadCurrentImage();
            }, 'image/jpeg', 0.95);
        });

        ui.skipBtn.addEventListener('click', () => {
            currentIndex++;
            loadCurrentImage();
        });

        ui.cancelBtn.addEventListener('click', () => {
            if(confirm("Cancel this batch process? All progress will be lost.")) {
                location.reload();
            }
        });

        function finishCropping() {
            ui.cropSection.classList.add('hidden');
            ui.resultSection.classList.remove('hidden');
            ui.processedCount.textContent = `${croppedImagesBlobs.length} images are ready for download.`;
            if (cropper) cropper.destroy();
        }

        ui.downloadZipBtn.addEventListener('click', async () => {
            if (croppedImagesBlobs.length === 0) return;
            
            ui.downloadZipBtn.disabled = true;
            ui.downloadZipBtn.innerText = "Processing ZIP...";
            
            const zip = new JSZip();
            croppedImagesBlobs.forEach(item => zip.file(item.fileName, item.blob));

            const content = await zip.generateAsync({ type: "blob" });
            saveAs(content, `batch_export_${Date.now()}.zip`);
            
            ui.downloadZipBtn.disabled = false;
            ui.downloadZipBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg> Download ZIP`;
            showMessage("DOWNLOAD STARTED!");
        });
    </script>
</body>
</html>
