<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartCrop Pro - Batch Image Cropper</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        .crop-area-wrapper {
            height: 420px;
            width: 100%;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cropper-container {
            width: 100% !important;
            height: 100% !important;
        }

        #image-to-crop {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        /* Live Logo Preview Overlay */
        #live-logo-preview {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cropper-view-box, .cropper-face {
            outline: 3px solid #3b82f6;
            outline-color: rgba(59, 130, 246, 0.9);
            border-radius: 4px;
        }

        .setting-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 16px;
        }

        input[type=range] {
            accent-color: #2563eb;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 selection:bg-blue-100">

    <div class="max-w-xl mx-auto py-6 px-4 pb-24 md:py-10">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-900 mb-1 tracking-tight">SmartCrop <span class="text-blue-600">Pro</span></h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.25em]">Precision Branding & Preview</p>
        </header>

        <!-- Configuration & Live Preview Section -->
        <div id="mainSection" class="fade-in">
            <div class="glass-morphism p-6 rounded-[2rem] shadow-2xl mb-4 border border-white">
                
                <!-- 01. Live Preview Screen -->
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400">01. Live Configuration</h2>
                    <span id="ratioDisplay" class="text-[9px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold uppercase">9:16 Preview</span>
                </div>

                <div class="crop-area-wrapper rounded-2xl mb-6 relative shadow-inner border border-slate-200" id="cropWrapper">
                    <!-- Default Background -->
                    <img id="image-to-crop" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1440&h=2560&auto=format&fit=crop" class="opacity-40">
                    <!-- Live Logo Preview -->
                    <img id="live-logo-preview" src="" alt="logo preview">
                </div>
                
                <!-- Dimensions -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Width</label>
                        <input type="number" id="targetWidth" value="1440" class="w-full bg-transparent font-black text-lg outline-none" oninput="updateRatioInfo()">
                    </div>
                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-1 uppercase">Height</label>
                        <input type="number" id="targetHeight" value="2560" class="w-full bg-transparent font-black text-lg outline-none" oninput="updateRatioInfo()">
                    </div>
                </div>

                <!-- Branding Settings -->
                <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4">02. Branding Settings</h2>
                <div class="grid grid-cols-1 gap-3 mb-6">
                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-2 uppercase">Logo Variant</label>
                        <div class="flex gap-2">
                            <button onclick="setLogoStyle('auto')" id="btn-auto" class="logo-style-btn flex-1 py-2 rounded-lg text-[10px] font-black border-2 border-blue-600 bg-blue-50 text-blue-600 transition-all uppercase tracking-tight">Standard</button>
                            <button onclick="setLogoStyle('white')" id="btn-white" class="logo-style-btn flex-1 py-2 rounded-lg text-[10px] font-black border-2 border-transparent bg-slate-100 text-slate-500 transition-all uppercase tracking-tight">White Mode</button>
                            <button onclick="setLogoStyle('black')" id="btn-black" class="logo-style-btn flex-1 py-2 rounded-lg text-[10px] font-black border-2 border-transparent bg-slate-100 text-slate-500 transition-all uppercase tracking-tight">Black Mode</button>
                        </div>
                    </div>

                    <div class="setting-card">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-[9px] font-bold text-slate-400 uppercase">Logo Size</label>
                            <span id="sizeValDisplay" class="text-[10px] font-black text-blue-600">17%</span>
                        </div>
                        <input type="range" id="logoSizeScale" min="5" max="50" value="17" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" oninput="updateLivePreview()">
                    </div>

                    <div class="setting-card">
                        <label class="block text-[9px] font-bold text-slate-400 mb-2 uppercase">Position & Padding</label>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="logoPos" class="bg-white border border-slate-200 rounded-lg py-2 px-3 text-[11px] font-bold outline-none" onchange="updateLivePreview()">
                                <option value="bottom-right" selected>Bottom Right</option>
                                <option value="bottom-left">Bottom Left</option>
                                <option value="top-right">Top Right</option>
                                <option value="top-left">Top Left</option>
                                <option value="center">Center</option>
                            </select>
                            <div class="flex items-center bg-white border border-slate-200 rounded-lg px-3">
                                <span class="text-[9px] font-bold text-slate-400 mr-2">GAP:</span>
                                <input type="number" id="logoPadding" value="0" class="w-full text-[11px] font-bold outline-none" min="0" max="25" oninput="updateLivePreview()">
                                <span class="text-[9px] font-bold text-slate-400 ml-1">%</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Upload CTA -->
                <div id="uploadArea" class="relative group">
                    <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="border-2 border-dashed border-slate-200 rounded-[2rem] p-10 bg-white group-hover:bg-blue-50 group-hover:border-blue-300 transition-all flex flex-col items-center justify-center text-center">
                        <div class="w-14 h-14 bg-blue-600 rounded-2xl shadow-xl shadow-blue-200 flex items-center justify-center mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                        </div>
                        <span class="text-slate-900 font-black text-md">Apply to Images</span>
                        <p class="text-slate-400 text-[10px] mt-1 font-bold uppercase">Select one or more photos</p>
                    </div>
                </div>

                <!-- Active Crop Controls -->
                <div id="cropControls" class="hidden pt-4 border-t border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <span id="imageCounter" class="text-[10px] font-black text-blue-600 uppercase tracking-widest">IMAGE 1 / 1</span>
                        <span id="currentImageName" class="text-[10px] text-slate-400 truncate max-w-[150px] font-medium italic">photo.jpg</span>
                    </div>
                    
                    <div class="flex gap-3 mb-3">
                        <button id="prevBtn" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-black text-lg hover:bg-black active:scale-[0.98] transition-all shadow-xl flex items-center justify-center gap-2 uppercase opacity-50 cursor-not-allowed" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                            <span>Back</span>
                        </button>
                        <button id="nextCropBtn" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-blue-700 active:scale-[0.98] transition-all shadow-xl shadow-blue-200 flex items-center justify-center gap-2 uppercase">
                            <span>Save & Next</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button id="skipBtn" class="py-3 bg-slate-50 text-slate-500 font-bold rounded-xl text-[10px] uppercase tracking-widest border border-slate-100">Skip Image</button>
                        <button id="resetCropBtn" class="py-3 bg-slate-50 text-slate-500 font-bold rounded-xl text-[10px] uppercase tracking-widest border border-slate-100">Reset Crop</button>
                    </div>
                    <button onclick="location.reload()" class="w-full mt-4 text-red-400 font-black text-[9px] uppercase tracking-widest">Cancel Batch</button>
                </div>
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden fade-in">
            <div class="glass-morphism p-10 rounded-[2.5rem] shadow-2xl border border-white text-center">
                <div class="w-16 h-16 bg-emerald-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-emerald-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                </div>
                <h3 class="text-2xl font-black text-slate-900 mb-2">Branding Complete!</h3>
                <p id="processedCount" class="text-slate-500 font-medium mb-8 text-sm italic">Images processed successfully.</p>
                <button id="downloadBtn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-black active:scale-[0.98] transition-all shadow-2xl flex items-center justify-center gap-4 mb-4">
                    <span id="downloadBtnText">Download Files</span>
                </button>
                <button onclick="location.reload()" class="w-full py-3 text-blue-600 font-black text-[10px] uppercase tracking-widest">Process More</button>
            </div>
        </div>

        <canvas id="watermarkCanvas" class="hidden"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        let selectedFiles = [];
        let currentIndex = 0;
        let cropper = null;
        let croppedImagesBlobs = []; // Array of {blob, fileName, originalIndex}
        let isBatchActive = false;
        let selectedLogoMode = 'auto'; 
        
        const logoUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg1edao5rDgs_ghf8tGxg6k9pId-JtXvKk1cS74LOjykj6F2rtq47nT-aUL3ChsITB_x8SXGpKG-pck25IOE_vNc_0BPTupQ26iJSnz9GGGOYZD_TrXHKKVmplbAOr_9O_aoRJEM8qaicG9-oU8JRL_0qpcsncCzK4SIbOUTIIW2uf2x4m0UieJrlIXYL6u/s1600/ChatGPT%20Image%20Feb%2028,%202026,%2007_42_18%20PM.png";

        const logoImg = new Image();
        logoImg.crossOrigin = "anonymous";
        logoImg.src = logoUrl;

        const ui = {
            mainSection: document.getElementById('mainSection'),
            uploadArea: document.getElementById('uploadArea'),
            cropControls: document.getElementById('cropControls'),
            resultSection: document.getElementById('resultSection'),
            fileInput: document.getElementById('fileInput'),
            imageToCrop: document.getElementById('image-to-crop'),
            liveLogo: document.getElementById('live-logo-preview'),
            logoSizeScale: document.getElementById('logoSizeScale'),
            sizeValDisplay: document.getElementById('sizeValDisplay'),
            nextCropBtn: document.getElementById('nextCropBtn'),
            prevBtn: document.getElementById('prevBtn'),
            skipBtn: document.getElementById('skipBtn'),
            resetCropBtn: document.getElementById('resetCropBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadBtnText: document.getElementById('downloadBtnText'),
            targetWidth: document.getElementById('targetWidth'),
            targetHeight: document.getElementById('targetHeight'),
            logoPos: document.getElementById('logoPos'),
            logoPadding: document.getElementById('logoPadding'),
            currentImageName: document.getElementById('currentImageName'),
            imageCounter: document.getElementById('imageCounter'),
            processedCount: document.getElementById('processedCount'),
            ratioDisplay: document.getElementById('ratioDisplay'),
            wmCanvas: document.getElementById('watermarkCanvas')
        };

        function setLogoStyle(style) {
            selectedLogoMode = style;
            document.querySelectorAll('.logo-style-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
                btn.classList.add('border-transparent', 'bg-slate-100', 'text-slate-500');
            });
            document.getElementById('btn-' + style).classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
            updateLivePreview();
        }

        function updateLivePreview() {
            const scale = parseInt(ui.logoSizeScale.value);
            ui.sizeValDisplay.textContent = `${scale}%`;
            
            const pos = ui.logoPos.value;
            const pad = parseInt(ui.logoPadding.value);
            
            ui.liveLogo.src = logoUrl;
            ui.liveLogo.style.width = `${scale}%`;
            
            if (selectedLogoMode === 'white') {
                ui.liveLogo.style.filter = 'brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.2))';
            } else if (selectedLogoMode === 'black') {
                ui.liveLogo.style.filter = 'brightness(0) drop-shadow(0 2px 4px rgba(255,255,255,0.1))';
            } else {
                ui.liveLogo.style.filter = 'drop-shadow(0 4px 6px rgba(0,0,0,0.3))';
            }

            ui.liveLogo.style.top = 'auto'; ui.liveLogo.style.bottom = 'auto';
            ui.liveLogo.style.left = 'auto'; ui.liveLogo.style.right = 'auto';
            ui.liveLogo.style.transform = 'none';

            if (pos === 'bottom-right') { ui.liveLogo.style.bottom = `${pad}%`; ui.liveLogo.style.right = `${pad}%`; }
            else if (pos === 'bottom-left') { ui.liveLogo.style.bottom = `${pad}%`; ui.liveLogo.style.left = `${pad}%`; }
            else if (pos === 'top-right') { ui.liveLogo.style.top = `${pad}%`; ui.liveLogo.style.right = `${pad}%`; }
            else if (pos === 'top-left') { ui.liveLogo.style.top = `${pad}%`; ui.liveLogo.style.left = `${pad}%`; }
            else { 
                ui.liveLogo.style.top = '50%'; ui.liveLogo.style.left = '50%'; 
                ui.liveLogo.style.transform = 'translate(-50%, -50%)';
            }
        }

        function gcd(a, b) { return b ? gcd(b, a % b) : a; }

        function updateRatioInfo() {
            const w = Math.max(1, parseInt(ui.targetWidth.value) || 1);
            const h = Math.max(1, parseInt(ui.targetHeight.value) || 1);
            ui.ratioDisplay.textContent = `${w/gcd(w,h)}:${h/gcd(w,h)} RATIO`;
            if (cropper) cropper.setAspectRatio(w/h);
        }

        ui.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFiles = Array.from(e.target.files);
                currentIndex = 0;
                croppedImagesBlobs = [];
                isBatchActive = true;
                ui.uploadArea.classList.add('hidden');
                ui.cropControls.classList.remove('hidden');
                ui.imageToCrop.classList.remove('opacity-40');
                loadCurrentImage();
                ui.fileInput.value = '';
            }
        });

        function loadCurrentImage() {
            if (currentIndex >= selectedFiles.length) { finishCropping(); return; }
            
            // Handle back button state
            if (currentIndex > 0) {
                ui.prevBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                ui.prevBtn.disabled = false;
            } else {
                ui.prevBtn.classList.add('opacity-50', 'cursor-not-allowed');
                ui.prevBtn.disabled = true;
            }

            const reader = new FileReader();
            ui.currentImageName.textContent = selectedFiles[currentIndex].name;
            ui.imageCounter.textContent = `IMAGE ${currentIndex + 1} / ${selectedFiles.length}`;
            reader.onload = (e) => {
                ui.imageToCrop.src = e.target.result;
                if (cropper) cropper.destroy();
                cropper = new Cropper(ui.imageToCrop, {
                    aspectRatio: parseInt(ui.targetWidth.value) / parseInt(ui.targetHeight.value),
                    viewMode: 1, autoCropArea: 1, dragMode: 'move',
                    ready() { updateLivePreview(); }
                });
            };
            reader.readAsDataURL(selectedFiles[currentIndex]);
        }

        async function processAndSave(croppedCanvas) {
            const ctx = ui.wmCanvas.getContext('2d', { willReadFrequently: true });
            const tw = parseInt(ui.targetWidth.value);
            const th = parseInt(ui.targetHeight.value);
            ui.wmCanvas.width = tw; ui.wmCanvas.height = th;
            ctx.drawImage(croppedCanvas, 0, 0, tw, th);

            const scale = parseInt(ui.logoSizeScale.value) / 100;
            const logoW = tw * scale;
            const padVal = parseInt(ui.logoPadding.value) / 100;
            const mx = tw * padVal;
            const my = th * padVal;
            const pos = ui.logoPos.value;

            if (logoImg.complete) {
                const fh = (logoW / logoImg.width) * logoImg.height;
                let x, y;
                if (pos === 'bottom-right') { x = tw - logoW - mx; y = th - fh - my; }
                else if (pos === 'bottom-left') { x = mx; y = th - fh - my; }
                else if (pos === 'top-right') { x = tw - logoW - mx; y = my; }
                else if (pos === 'top-left') { x = mx; y = my; }
                else { x = (tw - logoW) / 2; y = (th - fh) / 2; }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = logoImg.width;
                tempCanvas.height = logoImg.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(logoImg, 0, 0);

                if (selectedLogoMode === 'white') {
                    tCtx.globalCompositeOperation = 'source-in';
                    tCtx.fillStyle = '#ffffff';
                    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                } else if (selectedLogoMode === 'black') {
                    tCtx.globalCompositeOperation = 'source-in';
                    tCtx.fillStyle = '#000000';
                    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                }

                ctx.drawImage(tempCanvas, x, y, logoW, fh);
            }
            return new Promise(r => ui.wmCanvas.toBlob(b => r(b), 'image/jpeg', 0.92));
        }

        ui.nextCropBtn.addEventListener('click', async () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: parseInt(ui.targetWidth.value), height: parseInt(ui.targetHeight.value) });
            const blob = await processAndSave(canvas);
            
            // Remove previous entry for this index if exists (for back navigation logic)
            croppedImagesBlobs = croppedImagesBlobs.filter(i => i.originalIndex !== currentIndex);
            
            croppedImagesBlobs.push({ 
                blob, 
                fileName: `${selectedFiles[currentIndex].name.split('.')[0]}_branded.jpg`,
                originalIndex: currentIndex
            });
            
            currentIndex++;
            loadCurrentImage();
        });

        ui.prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadCurrentImage();
            }
        });

        ui.skipBtn.addEventListener('click', () => { 
            // Also remove from saved if we skip a previously saved image
            croppedImagesBlobs = croppedImagesBlobs.filter(i => i.originalIndex !== currentIndex);
            currentIndex++; 
            loadCurrentImage(); 
        });

        ui.resetCropBtn.addEventListener('click', () => cropper && cropper.reset());

        function finishCropping() {
            ui.mainSection.classList.add('hidden');
            ui.resultSection.classList.remove('hidden');
            ui.downloadBtnText.textContent = croppedImagesBlobs.length === 1 ? "Download Image" : `Download Zip (${croppedImagesBlobs.length})`;
            ui.processedCount.textContent = `${croppedImagesBlobs.length} images ready.`;
        }

        ui.downloadBtn.addEventListener('click', async () => {
            if (croppedImagesBlobs.length === 0) return;
            if (croppedImagesBlobs.length === 1) saveAs(croppedImagesBlobs[0].blob, croppedImagesBlobs[0].fileName);
            else {
                const zip = new JSZip();
                croppedImagesBlobs.forEach(i => zip.file(i.fileName, i.blob));
                saveAs(await zip.generateAsync({ type: "blob" }), `Branded_Batch_${Date.now()}.zip`);
            }
        });

        window.onload = () => {
            updateLivePreview();
            updateRatioInfo();
        };
    </script>
</body>
</html>
